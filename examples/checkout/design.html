<!doctype html>
<!--
  Stand-in for a Figma frame, used to build the example fixtures.
  data-node marks a layer; data-bind links a fill to a variable; data-layout marks auto layout.
  <html class="flawed"> reproduces the mistakes a real file tends to collect.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkout (design)</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 390px; height: 720px; background: #ffffff; font-family: "DejaVu Sans", Arial, sans-serif; color: #111113; }
  .frame { width: 390px; height: 720px; padding: 24px; display: flex; flex-direction: column; gap: 24px; background: #ffffff; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 24px; font-weight: 700; }
  .close { width: 44px; height: 44px; border-radius: 999px; background: #f6f6f8; display: grid; place-items: center; font-size: 18px; color: #111113; }
  .card { background: #f6f6f8; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; justify-content: space-between; font-size: 15px; }
  .muted { color: #5f5f68; }
  .rule { height: 1px; background: #e4e4e8; }
  .total { font-size: 18px; font-weight: 700; }
  .promo { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .promo p { font-size: 13px; color: #5f5f68; }
  .apply { font-size: 15px; font-weight: 700; color: #4b3fd6; height: 44px; padding: 0 12px; display: flex; align-items: center; }
  .methods { display: flex; gap: 8px; }
  .method { flex: 1; height: 48px; border-radius: 12px; border: 1px solid #e4e4e8; display: grid; place-items: center; font-size: 15px; background: #ffffff; }
  .method.on { border-color: #4b3fd6; color: #4b3fd6; font-weight: 700; }
  .spacer { flex: 1; }
  .pay { height: 52px; border-radius: 12px; background: #4b3fd6; color: #ffffff; font-size: 18px; font-weight: 700; display: grid; place-items: center; }

  /* the mistakes */
  .flawed .close { width: 20px; height: 20px; font-size: 13px; }
  .flawed .card { padding-left: 18px; }
  .flawed .total { font-size: 17px; }
  .flawed .promo p { color: #a1a1aa; }
  .flawed .apply { height: 20px; padding: 0; font-size: 13px; }
  .flawed .pay { background: #4a3fd5; border-radius: 10px; }
</style>
</head>
<body>
<div class="frame" data-node="Checkout" data-type="FRAME" data-layout="VERTICAL" data-bind="color/bg">
  <div class="top" data-node="Header" data-type="FRAME" data-layout="HORIZONTAL">
    <h1 data-node="Title" data-type="TEXT" data-bind="color/ink">Checkout</h1>
    <div class="close" data-node="Close button" data-type="INSTANCE" data-bind="color/surface" data-reactive>✕</div>
  </div>
  <div class="card" data-node="Order summary" data-type="FRAME" data-layout="VERTICAL" data-bind="color/surface">
    <div class="row" data-node="Line 1" data-type="FRAME" data-layout="HORIZONTAL"><span data-node="Item" data-type="TEXT" data-bind="color/ink">Annual membership</span><span data-node="Price" data-type="TEXT" data-bind="color/ink">$499.00</span></div>
    <div class="row" data-node="Line 2" data-type="FRAME" data-layout="HORIZONTAL"><span class="muted" data-node="Item" data-type="TEXT" data-bind="color/muted">Lab visit</span><span class="muted" data-node="Price" data-type="TEXT" data-bind="color/muted">Included</span></div>
    <div class="rule" data-node="Divider" data-type="RECTANGLE"></div>
    <div class="row total" data-node="Total row" data-type="FRAME" data-layout="HORIZONTAL"><span data-node="Total" data-type="TEXT" data-bind="color/ink">Total</span><span data-node="Amount" data-type="TEXT" data-bind="color/ink">$499.00</span></div>
  </div>
  <div class="promo" data-node="Promo" data-type="FRAME" data-layout="HORIZONTAL">
    <p data-node="Promo hint" data-type="TEXT">Have a promo code from your clinic?</p>
    <span class="apply" data-node="Apply link" data-type="TEXT-FRAME" data-bind="color/brand" data-reactive>Apply</span>
  </div>
  <div class="methods" data-node="Payment methods" data-type="FRAME" data-absolute>
    <div class="method on" data-node="Card" data-type="FRAME" data-bind="color/bg">Card</div>
    <div class="method" data-node="Apple Pay" data-type="FRAME" data-bind="color/bg">Apple Pay</div>
    <div class="method" data-node="PayPal" data-type="FRAME" data-bind="color/bg">PayPal</div>
  </div>
  <div class="spacer"></div>
  <div class="pay" data-node="Pay button" data-type="INSTANCE" data-bind-fixed="color/brand" data-reactive><span data-node="Label" data-type="TEXT" data-bind="color/brand-ink">Pay $499.00</span></div>
</div>
</body>
</html>
