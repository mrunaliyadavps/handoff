name: Handoff verify
description: Fail a pull request when the UI drifts from its Figma frame, its design tokens, or WCAG 2.2 AA.
branding:
  icon: check-square
  color: purple
inputs:
  target:
    description: URL of the running page, or path to an HTML file
    required: true
  reference:
    description: Figma frame exported as PNG
    required: false
  tokens:
    description: Figma variables JSON or a flat token map
    required: false
  scale:
    description: Pixel ratio of the reference export
    default: "1"
  max-diff:
    description: Allowed share of changed pixels (0 to 1)
    default: "0.02"
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev && npx playwright install --with-deps chromium
    - shell: bash
      run: |
        args=("${{ inputs.target }}" --format md --out .handoff --scale "${{ inputs.scale }}" --max-diff "${{ inputs.max-diff }}")
        [ -n "${{ inputs.reference }}" ] && args+=(--ref "${{ inputs.reference }}")
        [ -n "${{ inputs.tokens }}" ] && args+=(--tokens "${{ inputs.tokens }}")
        node "${{ github.action_path }}/bin/handoff.mjs" verify "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
        exit "${PIPESTATUS[0]}"
